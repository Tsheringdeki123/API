<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>Task List</h1>
  <p class="sub">Add, finish and remove tasks. Everything is saved in your MySQL database.</p>

  <div id="error" class="error" role="alert"></div>

  <form class="add" id="addForm">
    <input id="titleInput" type="text" placeholder="What needs doing?" maxlength="255" aria-label="New task title" autocomplete="off">
    <button class="btn-add" type="submit">Add task</button>
  </form>

  <div class="bar">
    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">To do</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <ul id="list" aria-live="polite"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
